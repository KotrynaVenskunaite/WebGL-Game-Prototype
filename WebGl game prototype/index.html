<!DOCTYPE html>
<html>
    <head>
        <title>Chamber Model</title>
        <link rel="stylesheet" href="style.css">
        <!-- <link rel="stylesheet" href="dialogue_typing.css"> -->
    </head>
    
    <body onload="InitDemo();">

        <div class="container">
            <div id="iris" class="iris">
                <canvas id="game_surface"  width="800" height="800"></canvas>
                    
                <div id="UI" class="UI">
                    <div id="interact_image"></div>
                    <div id="interact_text"></div>
                </div>

                <div id="dither_image">
                    <img id="image_window" src="textures/dither_gradient.png" alt = "dither example"></img>
                </div>

                <div id="dialogue_box" unselectable="on" onselectstart="return false;" >
                    <div id="dialog_name"></div>
                    <div id="dialog_text">
                        <div id="dialog_text_text"></div>
                        <div id="dialog_buttons">
                            <button class ="d_buttons" id="button_1">Option 1</button>
                            <button class ="d_buttons" id="button_2">Option 2</button>
                            <button class ="d_buttons" id="button_3"> KYS </button>
                            <button class ="d_buttons" id="button_4">Option 4</button>
                        </div>
                    </div>
                </div>

               
                

            </div>
            
        </div>

        <div class="drawing_area">
            <div class="drawing_canvas_container" id="drawing_canvas_id">
                <canvas id="drawing_canvas"  width="400" height="400"></canvas>
            </div>
            <div class="drawing_options">
                <input type="color" id="favcolor" name="favcolor" value="#ff0000">
                <!-- <label for="favcolor">Color</label> -->
                <input type="range" id="brushSize" name="Brush Size" min="1" max="30"/>
                <label for="Brush Size">Brush Size</label>
                <button onclick="clearCanvas()" class ="drawing_buttons">Clear</button>
                <button onclick="makeNormalMap()" class ="drawing_buttons">Make Normal Map</button>
            </div>
        </div>

        <div class="quiz_area">
            <div class="sentences">
                <div id="answer1">
                    <span>• Specular lighting controls</span><div id="first_sentence"></div><span>intensity</span>
                </div>
                <div id="answer2">
                    <span>• A texture to control reflective area is called a</span><div id="second_sentence"></div>
                </div>
                <div id="answer3">
                    <span>• Specular highlight depends on the</span><div id="third_sentence"></div><span>and</span><div id="fourth_sentence"></div><span>angle</span>
                </div>
                <div id="answer4">
                    <span>• Multiple shader methods</span><div id="fifth_sentence"></div><span>be used together</span>
                </div>
                
            </div>

            <div id="Word_area">
                <div class="list" draggable="true">can</div>
                <div class="list" draggable="true">object</div>
                <div class="list" draggable="true">shadow</div>
                <div class="list" draggable="true">reflection</div>
                <div class="list" draggable="true">normal map</div>
                <div class="list" draggable="true">should</div>
                <div class="list" draggable="true">highlight</div>
                <div class="list" draggable="true">specular map</div>
                <div class="list" draggable="true">camera</div>
                <div class="list" draggable="true">can't</div>
                <div class="list" draggable="true">light</div>
                <div class="list" draggable="true">bump map</div>
                <div class="list" draggable="true">normal</div>
            </div>
            

        </div>
        
        
        <!-- <i>Demo is above this text</i> -->
        
        <script src="app.js"></script>
        <script src="Models.js"></script>
        <script src="SceneDemo.js"></script>
        <script src="UI_controls.js"></script>
        <script src="PostProcess.js"></script>
        <script src="drawing.js"></script>
        <script src="quiz.js"></script>

        <script src="3rd_party_scripts/util.js"></script>
        <script src="3rd_party_scripts/async.js"></script>
        <script src="3rd_party_scripts/gl-matrix.js"></script>
        <script src="3rd_party_scripts/webglUtils.js"></script>
        <script src="3rd_party_scripts/Logger.js"></script>
        <script src="3rd_party_scripts/Vectors.js"></script>
    </body>
</html>
